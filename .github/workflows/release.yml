name: Release

# Publish: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*

      - name: Create release with test results
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for d in results-*; do mv "$d/results.md" "test-$d.md"; done
          gh release create "$TAG" test-results-*.md \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
